<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Custom Snake Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #cdeadb; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border: 2px solid #2ecc70; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const CELLS_ACROSS = 14;           // Cells along the shorter screen side (controls image size)
const BOARD_COLOR = '#eaf7f0';     // Light pastel mint play area
const BODY_COLOR = 'rgb(39, 174, 96)';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function load(src) { const i = new Image(); i.src = src; return i; }
const appleImgs = [load('apple1.png'), load('apple2.png'), load('apple3.png')];
const wallImg = load('Wall.png');
const headImg = load('snake_head.png');

let COLS = 0, ROWS = 0, cell = 0, W = 0, H = 0;

// Fill the screen: square cells, as many columns and rows as fit
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const availW = window.innerWidth - 8;   // room for the border
  const availH = window.innerHeight - 8;

  cell = Math.floor(Math.min(availW, availH) / CELLS_ACROSS);
  const newCols = Math.floor(availW / cell);
  const newRows = Math.floor(availH / cell);
  const changed = newCols !== COLS || newRows !== ROWS;
  COLS = newCols; ROWS = newRows;
  W = COLS * cell; H = ROWS * cell;

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  // If the board size changed mid-game (e.g. phone rotated), start fresh
  if (changed && snake) restart(); else draw();
}
window.addEventListener('resize', resize);

let snake, direction, lastMoved, food, appleImg, wall, wallDir, wallMove, wallGrow, gameOver;
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const same = (a, b) => a[0] === b[0] && a[1] === b[1];
const has = (list, p) => list.some(q => same(q, p));
const wrapX = v => ((v % COLS) + COLS) % COLS;  // Off one edge, back in on the opposite edge
const wrapY = v => ((v % ROWS) + ROWS) % ROWS;

function restart() {
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake = [[cx, cy], [cx, cy - 1], [cx, cy - 2]];   // Start in the middle, heading up
  direction = 'UP'; lastMoved = 'UP';
  food = [3, 3]; appleImg = pick(appleImgs);
  wall = [[COLS - 3, ROWS - 3]]; wallDir = 'LEFT'; wallMove = 0; wallGrow = 0;
  gameOver = false;
  draw();
}

function step([x, y], dir) {
  if (dir === 'UP') y += 1;
  else if (dir === 'DOWN') y -= 1;
  else if (dir === 'LEFT') x -= 1;
  else if (dir === 'RIGHT') x += 1;
  return [x, y];
}

function update() {
  if (gameOver) return;

  // 1. Moving wall: step, wrap around edges, grow every 15 moves
  wallMove++;
  if (wallMove >= 2) {
    wallMove = 0;
    if (Math.random() < 0.2) wallDir = pick(['UP', 'DOWN', 'LEFT', 'RIGHT']);
    const [wx, wy] = step(wall[0], wallDir);
    wall.unshift([wrapX(wx), wrapY(wy)]);
    wallGrow++;
    if (wallGrow >= 15) wallGrow = 0; else wall.pop();
  }

  // 2. Snake step: wraps around edges; only hitting itself or the wall ends the game
  const [nx, ny] = step(snake[0], direction);
  const head = [wrapX(nx), wrapY(ny)];
  if (has(snake, head) || has(wall, head)) {
    gameOver = true; draw(); return;
  }
  snake.unshift(head);
  lastMoved = direction;

  // 3. Apple eaten?
  if (same(head, food)) {
    do { food = [rand(COLS), rand(ROWS)]; } while (has(snake, food) || has(wall, food));
    appleImg = pick(appleImgs);
  } else {
    snake.pop();
  }
  draw();
}

// Game grid has y going up (like Kivy); the screen has y going down
function px(x, y) { return [x * cell, (ROWS - 1 - y) * cell]; }
function drawImg(img, x, y) {
  const [a, b] = px(x, y);
  if (img.complete && img.naturalWidth) ctx.drawImage(img, a, b, cell, cell);
  else { ctx.fillStyle = '#bbb'; ctx.fillRect(a, b, cell, cell); }
}

function draw() {
  if (!snake || !W) return;

  ctx.fillStyle = BOARD_COLOR;
  ctx.fillRect(0, 0, W, H);

  drawImg(appleImg, food[0], food[1]);
  wall.forEach(([x, y]) => drawImg(wallImg, x, y));
  snake.forEach(([x, y], i) => {
    if (i === 0) drawImg(headImg, x, y);
    else {
      const [a, b] = px(x, y);
      ctx.fillStyle = BODY_COLOR;
      ctx.fillRect(a + 1, b + 1, cell - 2, cell - 2);
    }
  });

  if (gameOver) {
    const s = Math.min(W, H);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(230, 26, 26)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.floor(s / 10)}px sans-serif`;
    ctx.fillText('GAME OVER', W / 2, H / 2 - s / 16);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.floor(s / 22)}px sans-serif`;
    ctx.fillText('[Tap to Restart]', W / 2, H / 2 + s / 16);
  }
}

function turn(dir) {
  const opposite = { UP: 'DOWN', DOWN: 'UP', LEFT: 'RIGHT', RIGHT: 'LEFT' };
  if (lastMoved !== opposite[dir]) direction = dir;
}

// Swipe controls (touch and mouse)
let sx = 0, sy = 0;
window.addEventListener('pointerdown', e => {
  if (gameOver) { restart(); return; }
  sx = e.clientX; sy = e.clientY;
});
window.addEventListener('pointerup', e => {
  if (gameOver) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 50) turn('RIGHT'); else if (dx < -50) turn('LEFT');
  } else {
    if (dy < -50) turn('UP'); else if (dy > 50) turn('DOWN');
  }
});

// Arrow keys on computers; Space or Enter restarts
window.addEventListener('keydown', e => {
  const map = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT' };
  if (gameOver && (e.key === ' ' || e.key === 'Enter')) { restart(); return; }
  if (map[e.key]) { e.preventDefault(); turn(map[e.key]); }
});

[...appleImgs, wallImg, headImg].forEach(i => i.onload = draw);
resize();
restart();
setInterval(update, 200);
</script>
</body>
</html>
